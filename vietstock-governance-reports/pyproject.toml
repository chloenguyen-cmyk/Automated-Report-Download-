[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govreports"
version = "0.1.0"
description = "Resumable bulk downloader and coverage analyzer for Vietnamese corporate governance reports (BCTHQT)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pandas>=1.5",
    "requests>=2.28",
    "openpyxl>=3.1",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
govreports = "govreports.cli:main"

[tool.setuptools.packages.find]
include = ["govreports*"]
